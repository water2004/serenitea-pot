[versions]
fabric-loader = "0.20.1"
fabric-api = "0.165.0+26.3"
fabric-permissions = "0.7.0"
fabric-kotlin = "1.14.1+kotlin.2.4.20"
arcade = "0.14.0-beta.21+26.3"
worldthreader = "hqEvFrrM"
axiom = "CrfjL7cY"
tpc = "5Yw3OOkF"
carpet = "yt9oDFOj"
fabric-loom = "1.19.3"
junit = "5.11.4"
junit-platform = "1.11.4"

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-permissions = { module = "me.lucko:fabric-permissions-api", version.ref = "fabric-permissions" }
fabric-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-kotlin" }
arcade-dimensions = { module = "net.casualchampionships:arcade-dimensions", version.ref = "arcade" }
arcade-event-registry = { module = "net.casualchampionships:arcade-event-registry", version.ref = "arcade" }
arcade-events-server = { module = "net.casualchampionships:arcade-events-server", version.ref = "arcade" }
arcade-extensions = { module = "net.casualchampionships:arcade-extensions", version.ref = "arcade" }
arcade-utils = { module = "net.casualchampionships:arcade-utils", version.ref = "arcade" }
worldthreader = { module = "maven.modrinth:LwH5rYyd", version.ref = "worldthreader" }
axiom = { module = "maven.modrinth:N6n5dqoA", version.ref = "axiom" }
tpc = { module = "maven.modrinth:ez3Wxkfr", version.ref = "tpc" }
carpet = { module = "maven.modrinth:TQTTVgYE", version.ref = "carpet" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

[bundles]
arcade = ["arcade-dimensions", "arcade-event-registry", "arcade-events-server", "arcade-extensions", "arcade-utils"]

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
