plugins {
    alias(libs.plugins.fabric.loom)
    id 'maven-publish'
}

version = project.property('mod_version')
group = project.property('maven_group')

base {
    archivesName = project.property('archives_base_name')
}

repositories {
    maven { url = uri('https://maven.supersanta.me/snapshots') }
    mavenCentral()
}

dependencies {
    minecraft(libs.minecraft)
    implementation(libs.fabric.loader)
    implementation(libs.fabric.api)
    implementation(libs.fabric.kotlin)

    implementation(libs.bundles.arcade)
    include(libs.bundles.arcade)

    testImplementation(libs.junit.jupiter)
    testRuntimeOnly(libs.junit.platform.launcher)
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'serenitea_pot_tests'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

def expandedModVersion = version.toString()

tasks.named('processResources', ProcessResources) {
    inputs.property('version', expandedModVersion)
    filesMatching('fabric.mod.json') {
        expand(version: expandedModVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
