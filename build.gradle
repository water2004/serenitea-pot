plugins {
    alias(libs.plugins.fabric.loom)
    id 'maven-publish'
}

def baseModVersion = project.property('mod_version')
def minecraftVersion = project.property('minecraft_version')

// Local builds use the current snapshot. Tagged CI builds pass release_version
// after validating the tag, so the JAR version is derived from that exact tag.
def developmentModVersion = "${baseModVersion}-snapshot.5"
def selectedModVersion = providers.gradleProperty('release_version').getOrElse(developmentModVersion)
version = "${selectedModVersion}-${minecraftVersion}"
group = project.property('maven_group')

base {
    archivesName = project.property('archives_base_name')
}

repositories {
    maven { url = uri('https://maven.supersanta.me/snapshots') }
    maven {
        url = uri('https://api.modrinth.com/maven')
        content { includeGroup('maven.modrinth') }
    }
    mavenCentral()
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraftVersion}")
    implementation(libs.fabric.loader)
    implementation(libs.fabric.api)
    implementation(libs.fabric.permissions)
    include(libs.fabric.permissions)
    implementation(libs.fabric.kotlin)

    implementation(libs.bundles.arcade)
    include(libs.bundles.arcade)

    // Optional integration target. Worldthreader is never bundled or required at runtime.
    compileOnly(libs.worldthreader)
    if (project.hasProperty('testWorldthreader')) {
        runtimeOnly(libs.worldthreader)
    }
    // Axiom 5 supplies the legacy packet compiled by the isolated compatibility adapter.
    compileOnly(libs.axiom5)
    if (project.hasProperty('testAxiom5') && project.hasProperty('testAxiom6')) {
        throw new GradleException('Choose either testAxiom5 or testAxiom6')
    }
    if (project.hasProperty('testAxiom5')) {
        runtimeOnly(libs.axiom5)
    }
    if (project.hasProperty('testAxiom6')) {
        runtimeOnly(libs.axiom6)
    }

    testImplementation(libs.junit.jupiter)
    testRuntimeOnly(libs.junit.platform.launcher)
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'serenitea_pot_tests'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

def expandedModVersion = version.toString()

tasks.named('processResources', ProcessResources) {
    inputs.property('version', expandedModVersion)
    inputs.property('minecraft_version', minecraftVersion)
    filesMatching('fabric.mod.json') {
        expand(version: expandedModVersion, minecraft_version: minecraftVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
